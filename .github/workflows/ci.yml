name: CI

on:
  push:
    branches: [ main, codex/v1-integration ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      APIPROOF_SECRET: ci-test-apiproof-secret-minimum-32-chars-long
      GITHUB_APP_ID: "12345"
      GITHUB_APP_SLUG: apiproof-ci
      GITHUB_APP_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIIPlaceholder\n-----END RSA PRIVATE KEY-----"
      GITHUB_WEBHOOK_SECRET: ci-test-webhook-secret-32-chars-long!
      CRON_SECRET: ci-test-cron-secret-32-chars-long!
      APIPROOF_LOCAL_SEED_PASSWORD: ci-local-seed-password-only-for-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 10.30.3

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Run Linter
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Validate provider registry
        run: pnpm providers:validate:all

      - name: Validate provider isolation
        run: pnpm providers:validate:multi

      - name: Run Test Suite
        run: pnpm test

      - name: Run Production Build
        run: pnpm -r build

      - name: Generate release manifest
        run: pnpm release:manifest
