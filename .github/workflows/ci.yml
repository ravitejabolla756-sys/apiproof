name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      APIPROOF_SECRET: ci-fixture-value-minimum-32-chars-long
      GITHUB_APP_ID: "12345"
      GITHUB_APP_SLUG: apiproof-ci
      GITHUB_APP_PRIVATE_KEY: private-key-fixture
      GITHUB_WEBHOOK_SECRET: webhook-fixture-value-minimum-32-chars
      CRON_SECRET: cron-fixture-value-minimum-32-chars
      APIPROOF_LOCAL_SEED_PASSWORD: ci-local-seed-password-only-for-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Build workspace packages
        run: pnpm -r build

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Validate provider registry
        run: pnpm providers:validate:all

      - name: Validate provider isolation
        run: pnpm providers:validate:multi

      - name: Run Test Suite
        run: pnpm test

      - name: Generate release manifest
        run: pnpm release:manifest
