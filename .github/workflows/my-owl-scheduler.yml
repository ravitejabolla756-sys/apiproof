name: MY OWL Scheduler

on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Scheduled operation to run'
        required: true
        default: 'provider-changelog'
        type: choice
        options:
          - provider-changelog
          - scheduled-rescan

permissions:
  contents: read

concurrency:
  group: my-owl-scheduler
  cancel-in-progress: false

jobs:
  provider-changelog:
    if: (github.event_name == 'workflow_dispatch' && inputs.job == 'provider-changelog') || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh provider changelogs and process bounded rescans
        env:
          MY_OWL_APP_URL: ${{ vars.MY_OWL_APP_URL }}
          WORKER_AUTH_SECRET: ${{ secrets.WORKER_AUTH_SECRET }}
          WORKER_ID: github-actions-scheduler
        run: |
          set -euo pipefail
          test -n "$MY_OWL_APP_URL"
          test -n "$WORKER_AUTH_SECRET"
          timestamp=$(date +%s%3N)
          signature=$(printf '%s\n%s\nGET\n/api/internal/provider-changelog' "$WORKER_ID" "$timestamp" | openssl dgst -sha256 -hmac "$WORKER_AUTH_SECRET" -hex | awk '{print $NF}')
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            -H "x-apiproof-worker-id: $WORKER_ID" \
            -H "x-apiproof-worker-timestamp: $timestamp" \
            -H "x-apiproof-worker-signature: $signature" \
            "$MY_OWL_APP_URL/api/internal/provider-changelog"

  scheduled-rescan:
    if: (github.event_name == 'workflow_dispatch' && inputs.job == 'scheduled-rescan') || (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enqueue and process nightly repository rescans
        env:
          MY_OWL_APP_URL: ${{ vars.MY_OWL_APP_URL }}
          WORKER_AUTH_SECRET: ${{ secrets.WORKER_AUTH_SECRET }}
          WORKER_ID: github-actions-scheduler
        run: |
          set -euo pipefail
          test -n "$MY_OWL_APP_URL"
          test -n "$WORKER_AUTH_SECRET"
          timestamp=$(date +%s%3N)
          signature=$(printf '%s\n%s\nGET\n/api/internal/scheduled-rescan' "$WORKER_ID" "$timestamp" | openssl dgst -sha256 -hmac "$WORKER_AUTH_SECRET" -hex | awk '{print $NF}')
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            -H "x-apiproof-worker-id: $WORKER_ID" \
            -H "x-apiproof-worker-timestamp: $timestamp" \
            -H "x-apiproof-worker-signature: $signature" \
            "$MY_OWL_APP_URL/api/internal/scheduled-rescan"
